<style>
:root {
  --paper: #ffffff;
  --floor: #f2f5f8;
  --ink: #17212b;
  --muted: #5b6b7a;
  --line: #dce3ea;
  --radar: #0f7c8c;
  --radar-soft: #e3f2f3;
  --target: #f26b1d;
  --danger: #c2352b;
  --on-radar: #ffffff;
  --radius-l: 18px;
  --radius-s: 10px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
/* Dark colours follow Homey's own page, not the phone setting: fpTheme() in the script sets data-theme
   from the background Homey actually draws, so the view always blends in. */
:root[data-theme="dark"] {
  --paper: #12181f;
  --floor: #1f2730;
  --ink: #eef2f6;
  --muted: #9aa8b5;
  --line: #2f3a46;
  --radar: #3fb6c4;
  --radar-soft: #16343a;
  --on-radar: #08262b;
}
.fp { font-family: var(--font); color: var(--ink); background: transparent; font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
.fp * { box-sizing: border-box; }
.fp h2 { font-size: 22px; line-height: 1.2; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 6px; }
.fp p { margin: 0 0 12px; color: var(--muted); max-width: 60ch; }
.fp .num { font-variant-numeric: tabular-nums; }

/* progress: a real sequence, so it is numbered */
.fp-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 4px 0 18px; }
.fp-steps span { height: 4px; border-radius: 4px; background: var(--line); transition: background .25s; }
.fp-steps span.done { background: var(--radar); }
.fp-step-label { font-size: 13px; color: var(--muted); margin-bottom: 4px; }

/* sensor choice */
.fp-choice { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px; margin-bottom: 10px; background: var(--paper); color: var(--ink);
  border: 1.5px solid var(--line); border-radius: var(--radius-l); text-align: left; font: inherit; cursor: pointer; }
.fp-choice[aria-pressed="true"] { border-color: var(--radar); background: var(--radar-soft); }
.fp-choice svg { flex: 0 0 40px; height: 40px; }
.fp-choice strong { display: block; font-weight: 600; }
.fp-choice small { color: var(--muted); font-size: 13px; }

/* map */
.fp-map-wrap { position: relative; border-radius: var(--radius-l); overflow: hidden; background: var(--floor); }
.fp-map { display: block; width: 100%; touch-action: none; cursor: crosshair; }
.fp-map-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 10px 2px 0; font-size: 13px; color: var(--muted); }
.fp-live { display: inline-flex; align-items: center; gap: 6px; }
.fp-live i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.fp-live.on i { background: var(--target); animation: fp-pulse 1.6s ease-out infinite; }
@keyframes fp-pulse { 0% { box-shadow: 0 0 0 0 rgba(242,107,29,.5); } 100% { box-shadow: 0 0 0 8px rgba(242,107,29,0); } }
@media (prefers-reduced-motion: reduce) { .fp-live.on i { animation: none; } .fp-steps span { transition: none; } }

/* switch */
.fp-switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.fp-switch input { appearance: none; -webkit-appearance: none; width: 34px; height: 20px; border-radius: 20px; background: var(--line); position: relative; margin: 0; cursor: pointer; transition: background .2s; }
.fp-switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; }
.fp-switch input:checked { background: var(--radar); }
.fp-switch input:checked::after { transform: translateX(14px); }

/* form */
.fp-field { margin: 0 0 18px; }
.fp-field label { display: block; font-weight: 600; margin-bottom: 8px; }
.fp-input { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: var(--radius-s); border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); }
.fp-input:focus { outline: none; border-color: var(--radar); }
.fp-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.fp-chip { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
.fp .fp-chip[aria-pressed="true"] { border-color: var(--radar) !important; background: var(--radar-soft) !important; color: var(--ink) !important; }
/* segmented control. Homey loads its own stylesheet on these pages that also styles buttons,
   so the states here are forced, otherwise the chosen option is not visible. */
.fp .fp-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px;
  background: var(--floor); border: 1.5px solid var(--line); border-radius: 14px; }
.fp .fp-seg > button { -webkit-appearance: none !important; appearance: none !important; margin: 0 !important;
  border: 0 !important; border-radius: 10px !important; box-shadow: none !important; min-height: 0 !important;
  background: transparent !important; color: var(--muted) !important; font: 600 14px var(--font) !important;
  padding: 10px 4px !important; line-height: 1.2 !important; cursor: pointer; }
.fp .fp-seg > button[aria-pressed="true"] { background: var(--radar) !important; color: var(--on-radar) !important;
  box-shadow: 0 2px 6px rgba(15, 124, 140, .35) !important; }
.fp .fp-seg > button:active:not([aria-pressed="true"]) { background: var(--radar-soft) !important; color: var(--ink) !important; }
.fp .fp-seg-strong > button { padding: 12px 4px !important; font-size: 15px !important; }

/* summary */
.fp-summary { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; padding: 16px; border: 1.5px solid var(--line); border-radius: var(--radius-l); margin-top: 14px; }
.fp-summary dt { color: var(--muted); }
.fp-summary dd { margin: 0; font-weight: 600; text-align: right; }

/* action bar */
.fp-actions { position: sticky; bottom: 0; display: flex; gap: 10px; padding: 14px 0 6px; background: linear-gradient(to top, var(--paper) 70%, transparent); margin-top: 18px; }
.fp-btn { font: inherit; font-weight: 600; font-size: 16px; padding: 14px 18px; border-radius: 14px; border: 0; cursor: pointer; }
.fp-btn.primary { flex: 1; background: var(--radar); color: var(--on-radar); }
.fp-btn.primary:disabled { opacity: .35; cursor: default; }
.fp-btn.ghost { background: transparent; color: var(--ink); }
.fp-btn.danger { background: transparent; color: var(--danger); }
.fp :focus-visible { outline: 3px solid var(--radar); outline-offset: 2px; }

.fp-note { font-size: 13px; color: var(--muted); }
.fp-empty { padding: 28px 18px; text-align: center; border: 1.5px dashed var(--line); border-radius: var(--radius-l); color: var(--muted); }
.fp-zonelist { display: grid; gap: 8px; margin-top: 14px; }
.fp-zonerow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--radius-s); background: var(--paper); color: var(--ink); font: inherit; text-align: left; cursor: pointer; width: 100%; }
.fp .fp-zonerow[aria-pressed="true"] { border-color: var(--radar) !important; background: var(--radar-soft) !important; }
.fp-zonerow i { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 12px; }
.fp-zonerow span { flex: 1; }
.fp-zonerow small { color: var(--muted); }
[hidden] { display: none !important; }
.fp-actions.static { position: static; background: none; padding-top: 6px; }
.fp-btn.danger.armed { background: var(--danger); color: #fff; }
.fp-link { font: inherit; font-size: 13px; font-weight: 600; color: var(--radar); background: none; border: 0; padding: 4px 0; cursor: pointer; }
.fp-tools { display: flex; gap: 8px; margin-top: 12px; }
.fp-target { margin-top: 14px; padding: 14px; border: 1.5px solid var(--target); border-radius: var(--radius-l); }
.fp-target strong { display: block; margin-bottom: 4px; }
.fp-target .fp-tools { flex-wrap: wrap; align-items: center; margin-top: 4px; }

/* press feedback: every button visibly reacts to a tap */
.fp button { -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: transform .08s ease, background-color .15s ease, filter .15s ease, opacity .15s ease; }
.fp button:active:not(:disabled) { transform: scale(0.96); }
.fp-btn.primary:active:not(:disabled), .fp-btn.danger.armed:active { filter: brightness(0.85); }
.fp-btn.ghost:active:not(:disabled), .fp-btn.danger:active:not(:disabled) { background: var(--floor); }
.fp-chip:active:not(:disabled), .fp-zonerow:active, .fp-choice:active, .fp-seg button:active:not([aria-pressed="true"]) { background: var(--radar-soft); }
.fp-link:active { opacity: .55; }

/* busy: the button shows a spinner while the sensor is being asked */
.fp button.busy { position: relative; color: transparent !important; pointer-events: none; }
.fp button.busy::after { content: ""; position: absolute; inset: 0; margin: auto; width: 18px; height: 18px; border-radius: 50%;
  border: 2.5px solid var(--spin, var(--ink)); border-right-color: transparent; animation: fp-spin .7s linear infinite; }
.fp-btn.primary.busy { --spin: var(--on-radar); }
.fp-btn.danger.busy { --spin: var(--danger); }
@keyframes fp-spin { to { transform: rotate(360deg); } }

/* toast: short confirmation after an action */
.fp-toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--paper); font: 600 14px var(--font); padding: 10px 16px; border-radius: 999px;
  width: max-content; text-align: center;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .18); transition: opacity .2s ease, transform .2s ease; }
.fp-toast.show { opacity: 1; transform: translate(-50%, 0); }
.fp-toast.error { background: var(--danger); color: #fff; }
@media (prefers-reduced-motion: reduce) {
  .fp button, .fp-toast { transition: none; }
  .fp button:active:not(:disabled) { transform: none; }
  .fp button.busy::after { animation-duration: 2s; }
}
.fp-btn.busy:disabled { opacity: 1; }

/* panel and toolbar above the map */
.fp-panel { margin-top: 16px; padding: 16px; border: 1.5px solid var(--line); border-radius: var(--radius-l); }
.fp-toolbar { position: sticky; top: 0; z-index: 3; margin-top: 16px; padding: 10px 12px; display: grid; gap: 10px;
  background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--radius-l) var(--radius-l) 0 0; border-bottom: 0; }
.fp-toolbar-row { display: flex; align-items: center; gap: 10px; }
.fp-toolbar-row .fp-count { flex: 1; font-size: 14px; color: var(--muted); }
.fp-toolbar-row .fp-btn.small { padding: 11px 14px; font-size: 15px; border-radius: 12px; }
.fp-toolbar-row .fp-btn.primary.small { flex: 1; }
.fp-toolbar + .fp-map-wrap { border-radius: 0 0 var(--radius-l) var(--radius-l); border: 1.5px solid var(--line); border-top: 0; }

/* overlays on the map */
.fp-overlay { position: absolute; left: 8px; right: 8px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
.fp-overlay.top { top: 8px; }
.fp-pill { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px;
  background: color-mix(in srgb, var(--paper) 88%, transparent); border: 1px solid var(--line); color: var(--ink);
  font: 600 12px var(--font); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
button.fp-pill { cursor: pointer; -webkit-appearance: none; appearance: none; }
.fp button.fp-pill[aria-pressed="true"] { background: var(--radar) !important; color: var(--on-radar) !important; border-color: var(--radar) !important; }
.fp-map-wrap .fp-target { position: absolute; left: 8px; right: 8px; bottom: 8px; margin: 0; background: var(--paper);
  box-shadow: 0 8px 24px rgba(0,0,0,.18); }

/* Homey's stylesheet also styles plain buttons. These rules win, so our buttons look the same everywhere. */
.fp button { -webkit-appearance: none !important; appearance: none !important; margin: 0 !important; min-height: 0 !important;
  height: auto !important; text-transform: none !important; letter-spacing: normal !important; line-height: 1.25 !important;
  font-family: var(--font) !important; cursor: pointer; }
.fp .fp-choice { display: flex !important; align-items: center; gap: 16px; width: 100% !important; margin-bottom: 10px !important;
  padding: 16px !important; text-align: left !important; background: var(--paper) !important; color: var(--ink) !important;
  border: 1.5px solid var(--line) !important; border-radius: var(--radius-l) !important; box-shadow: none !important; font-size: 15px !important; }
.fp .fp-choice[aria-pressed="true"] { border-color: var(--radar) !important; background: var(--radar-soft) !important; }
.fp .fp-choice svg { flex: 0 0 52px; width: 52px; height: 52px; color: var(--ink); }
.fp .fp-choice strong { font-size: 16px; }
.fp .fp-btn { border: 0 !important; border-radius: 14px !important; padding: 14px 18px !important; font-size: 16px !important;
  font-weight: 600 !important; box-shadow: none !important; }
.fp .fp-btn.primary { background: var(--radar) !important; color: var(--on-radar) !important; }
.fp .fp-btn.primary:disabled { opacity: .35 !important; }
.fp .fp-btn.ghost { background: transparent !important; color: var(--ink) !important; }
.fp .fp-btn.danger { background: transparent !important; color: var(--danger) !important; }
.fp .fp-btn.danger.armed { background: var(--danger) !important; color: #fff !important; }
.fp .fp-chip { background: var(--paper) !important; color: var(--ink) !important; border: 1.5px solid var(--line) !important;
  border-radius: 999px !important; padding: 7px 12px !important; font-size: 14px !important; font-weight: 500 !important; box-shadow: none !important; }
.fp .fp-link { background: none !important; border: 0 !important; color: var(--radar) !important; padding: 4px 0 !important;
  font-size: 13px !important; font-weight: 600 !important; box-shadow: none !important; }

  border-radius: var(--radius-s) !important; padding: 12px 14px !important; width: 100% !important; box-shadow: none !important; font-size: 15px !important; }

/* the wizard fills the sheet: content on top, buttons at the bottom */
.fp-wizard { display: flex; flex-direction: column; }
.fp-wizard > section:not([hidden]) { flex: 1 0 auto; }
.fp-wizard .fp-actions { margin-top: auto; padding-top: 18px; }

/* custom number of seconds */
.fp-custom { margin-top: 12px; }
.fp-custom label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.fp-custom-row { display: flex; align-items: center; gap: 10px; }
.fp-custom-row .fp-input { max-width: 140px; }
.fp-custom-row span { color: var(--muted); }
.fp-input.invalid { border-color: var(--danger) !important; }

.fp-map-bar-top { margin: 0 2px 8px; }

<script>
/*
 * FP400 floor map with paintable cells, like the Aqara app.
 * Grid: 16 columns x 20 rows of 0.5 m; x from -400 to 400 cm, y from 0 to 1000 cm in front of the sensor.
 * Cell index = row * 16 + column (row 0 is closest to the sensor).
 */
var FP_ZONE_COLORS = ['#0f7c8c', '#6b5bd2', '#d9488b', '#c98a00', '#2e9e5b', '#3a7bd5', '#b4532a', '#6c7a89'];
var FP_GRID = { cols: 16, rows: 20, cell: 50, xMin: -400 };

/*
 * Colours: follow Homey's look (light or dark). Signals, strongest first:
 *   1. the user's own choice in the app settings ("light" or "dark")
 *   2. a Homey dark mode class on the page
 *   3. Homey's CSS variables (--homey-background-color / --homey-text-color), if this page has them
 *   4. the real background colour of the page
 *   5. the phone setting
 * When the chosen look does not match the page background, the page background is painted too,
 * so there is never a dark block on a white page or the other way around.
 */
function fpParseColor(c) {
  if (!c || c === 'transparent') return null;
  var v = c.match(/[\d.]+/g);
  if (!v || v.length < 3) return null;
  if (v.length > 3 && Number(v[3]) === 0) return null;
  return v.slice(0, 3).map(Number);
}
function fpLum(rgb) { return (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255; }
function fpResolveVar(name, prop) {
  var probe = document.createElement('div');
  probe.style.cssText = 'position:absolute;width:0;height:0;visibility:hidden;' + prop + ':var(' + name + ')';
  document.body.appendChild(probe);
  var value = getComputedStyle(probe)[prop === 'color' ? 'color' : 'backgroundColor'];
  document.body.removeChild(probe);
  var raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return raw ? fpParseColor(value) : null;
}
function fpTheme(pref) {
  var root = document.documentElement, body = document.body;
  var info = { pref: pref || 'auto' };
  // measure Homey's page without our own paint
  root.style.removeProperty('background'); body.style.removeProperty('background');
  var classes = (root.className + ' ' + body.className).toLowerCase();
  info.classes = classes.trim();
  var pageBg = null;
  for (var el = body; el && !pageBg; el = el.parentElement) {
    pageBg = fpParseColor(getComputedStyle(el).backgroundColor);
  }
  info.pageBg = pageBg;
  info.homeyBg = fpResolveVar('--homey-background-color', 'background-color');
  info.homeyText = fpResolveVar('--homey-text-color', 'color');
  info.prefersDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

  var dark, source;
  if (pref === 'light' || pref === 'dark') { dark = pref === 'dark'; source = 'choice'; }
  else if (/homey-dark-mode|\bdark\b/.test(classes)) { dark = true; source = 'class'; }
  else if (info.homeyBg) { dark = fpLum(info.homeyBg) < 0.5; source = 'homey-background'; }
  else if (info.homeyText) { dark = fpLum(info.homeyText) > 0.5; source = 'homey-text'; }
  else if (pageBg) { dark = fpLum(pageBg) < 0.5; source = 'page'; }
  else { dark = info.prefersDark; source = 'phone'; }
  info.dark = dark; info.source = source;

  root.setAttribute('data-theme', dark ? 'dark' : 'light');
  function fits(c) { return c && (fpLum(c) < 0.5) === dark; }
  var paper = fits(info.homeyBg) ? info.homeyBg : fits(pageBg) ? pageBg : null;
  if (paper) root.style.setProperty('--paper', 'rgb(' + paper.join(',') + ')'); else root.style.removeProperty('--paper');
  var matches = fits(pageBg);
  if (!matches) {
    // The page behind this view does not match the chosen look: paint it ourselves.
    root.style.setProperty('background', 'var(--paper)', 'important');
    body.style.setProperty('background', 'var(--paper)', 'important');
  }
  info.painted = !matches;
  return info;
}

/** Re-check the look a few times and whenever Homey or the phone changes it. */
function fpWatchTheme(getPref, onChange) {
  function run() { var info = fpTheme(getPref()); if (onChange) onChange(info); return info; }
  [0, 300, 1000, 2500].forEach(function (ms) { setTimeout(run, ms); });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', run); else if (mq.addListener) mq.addListener(run);
  }
  if (window.MutationObserver) {
    var obs = new MutationObserver(function () { run(); });
    obs.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    obs.observe(document.body, { attributes: true, attributeFilter: ['class'] });
  }
  return run;
}

function fpCellInfo(cells) {
  var rows = cells.map(function (c) { return Math.floor(c / FP_GRID.cols); });
  return {
    count: cells.length,
    area: cells.length * 0.25,
    from: rows.length ? Math.min.apply(null, rows) * 0.5 : 0,
    to: rows.length ? (Math.max.apply(null, rows) + 1) * 0.5 : 0,
  };
}

function FpMap(canvas, options) {
  var self = this;

  // Free space around the grid (in cells), so people at the edge or right in front of the sensor stay visible.

  var draft = new Set(), editing = null, mode = null, last = null;

  self.mirror = false;

  function color(name) { return css.getPropertyValue(name).trim(); }

  function resize() {

    canvas.height = Math.round(h * r);

    if (self.mirror) col = G.cols - 1 - col;

    var row = Math.floor((self.base - (evt.clientY - b.top)) / self.size);
    if (col < 0 || col >= G.cols || row < 0 || row >= G.rows) return null;
    if (self.mirror) col = G.cols - 1 - col;
    return row * G.cols + col;
  }
  function sx(xcm) { var x = self.mirror ? -xcm : xcm; return self.left + (x - G.xMin) / G.cell * self.size; }
  function sy(ycm) { return self.base - ycm / G.cell * self.size; }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function fillCell(index, style, alpha, inset) {
    var c = cellRect(index), i = inset || 1.5;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = style;
    roundRect(c.x + i, c.y + i, c.s - 2 * i, c.s - 2 * i, Math.min(5, c.s / 5));
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawArea(cell, type, strength) {
    var c = cellRect(cell), i = 1.5;
    if (type === 'ignore') {
      fillCell(cell, '#c2352b', Math.min(1, 0.32 * strength));
    } else {
      fillCell(cell, color('--ink'), Math.min(1, 0.12 * strength));
      ctx.save();
      ctx.beginPath(); ctx.rect(c.x + i, c.y + i, c.s - 2 * i, c.s - 2 * i); ctx.clip();
      ctx.strokeStyle = color('--muted'); ctx.lineWidth = 1; ctx.globalAlpha = Math.min(1, 0.5 * strength);
      for (var k = -c.s; k < c.s; k += 6) { ctx.beginPath(); ctx.moveTo(c.x + k, c.y + c.s); ctx.lineTo(c.x + k + c.s, c.y); ctx.stroke(); }
      ctx.restore();
    }
  }

  function render() {
    if (!self.w) return;
    var W = self.w, H = self.h;
    ctx.clearRect(0, 0, W, H);

    var ox = sx(0), oy = self.base;

    // empty cells
    for (var i = 0; i < G.cols * G.rows; i++) fillCell(i, color('--line'), 0.45, 2.5);

    // metre labels every 2 m on the left edge
    ctx.fillStyle = color('--muted'); ctx.font = '11px ' + color('--font');
    for (var m = 2; m <= 10; m += 2) ctx.fillText(m + ' m', self.left + 4, sy(m * 100) + 12);

    // the sensor's own areas: ignore spots (red) and outside the room (hatched)
    ['outside', 'ignore'].forEach(function (type) {
      if (editing === 'area:' + type) return;
      (data.areas[type] || []).forEach(function (cell) { drawArea(cell, type, 1); });
    });

    // saved zones; the one being edited is drawn from the draft instead
    Object.keys(data.zones).forEach(function (id) {
      if (String(id) === String(editing)) return;
      var z = data.zones[id], c = FP_ZONE_COLORS[(id - 1) % 8], st = data.zoneStates[id] || {};
      (z.cells || []).forEach(function (cell) { fillCell(cell, c, st.occupied ? 0.75 : 0.4); });
      label(z.name, z.cells, c);
    });

    // draft (painting)
    if (typeof editing === 'string' && editing.indexOf('area:') === 0) {
      var type = editing.slice(5);
      draft.forEach(function (cell) { drawArea(cell, type, 1.6); });
    } else {
      var draftColor = editing && editing !== 'new' ? FP_ZONE_COLORS[(editing - 1) % 8] : color('--ink');
      draft.forEach(function (cell) { fillCell(cell, draftColor, 0.95); });
    }

    // people
    // people: never drawn off the map; outside the grid they are clamped to the edge and shown with a ring.
    // Targets on an ignore spot or outside the room are grey: they do not count for zones.
    drawnTargets = [];
    data.targets.forEach(function (p) {
      var rad = Math.max(6, self.size * 0.32);
      var px = sx(p.x), py = sy(p.y);
      var cx = Math.min(Math.max(px, rad + 2), W - rad - 2), cy = Math.min(Math.max(py, rad + 2), H - rad - 2);
      var outside = cx !== px || cy !== py || p.y < 0 || p.y >= G.rows * G.cell || p.x < G.xMin || p.x >= -G.xMin;
      drawnTargets.push({ t: p, x: cx, y: cy, r: rad });
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 6.29);
      if (p.ignored) {
        ctx.fillStyle = color('--paper'); ctx.fill();
        ctx.strokeStyle = color('--muted'); ctx.lineWidth = 3; ctx.stroke();
      } else if (outside) {
        ctx.strokeStyle = color('--target'); ctx.lineWidth = 3; ctx.stroke();
      } else {
        ctx.fillStyle = color('--target');
        ctx.fill();
        ctx.strokeStyle = color('--paper'); ctx.lineWidth = 2; ctx.stroke();
      }
    });

    // sensor, on the wall just below the grid
    ctx.fillStyle = color('--ink');
    roundRect(ox - 16, oy + self.size * 0.55, 32, 6, 3); ctx.fill();
  }

  function label(name, cells, c) {
    if (!cells || !cells.length) return;
    // top row of the zone, leftmost cell on screen
    var best = null;
    cells.forEach(function (cell) {
      var r = cellRect(cell);
      if (!best || r.y < best.y || (r.y === best.y && r.x < best.x)) best = r;
    });
    ctx.font = '600 11px ' + color('--font');
    var tw = ctx.measureText(name).width + 10;
    var x = Math.min(best.x, self.w - tw - 2), y = Math.max(best.y - 18, 2);
    ctx.fillStyle = color('--paper'); ctx.globalAlpha = 0.9; roundRect(x, y, tw, 16, 8); ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = c; ctx.fillText(name, x + 5, y + 12);
  }

  /* painting: the first cell decides whether this stroke paints or erases */
  function apply(cell) {
    if (cell === null) return;
    if (mode === 'paint') draft.add(cell); else draft.delete(cell);
  }
  function line(a, b) {
    // walk the grid between two cells so a fast swipe leaves no gaps
    var ac = a % G.cols, ar = Math.floor(a / G.cols), bc = b % G.cols, br = Math.floor(b / G.cols);
    var steps = Math.max(Math.abs(bc - ac), Math.abs(br - ar));
    for (var s = 1; s <= steps; s++) {
      apply(Math.round(ar + (br - ar) * s / steps) * G.cols + Math.round(ac + (bc - ac) * s / steps));
    }
  }
  function hitTarget(e) {
    var b = canvas.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
    for (var i = drawnTargets.length - 1; i >= 0; i--) {
      var d = drawnTargets[i];
      if (Math.hypot(d.x - x, d.y - y) <= d.r + 6) return d;
    }
    return null;
  }
  canvas.addEventListener('pointerdown', function (e) {
    if (options.onTargetTap) {
      var hit = hitTarget(e);
      if (hit) { tap = { t: hit.t, x: e.clientX, y: e.clientY }; return; }
    }
    if (!options.paint) return;
    var cell = cellAt(e);
    if (cell === null) return;
    mode = draft.has(cell) ? 'erase' : 'paint';
    apply(cell); last = cell;
    canvas.setPointerCapture(e.pointerId);
    render(); changed();
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!mode) return;
    var cell = cellAt(e);
    if (cell === null || cell === last) return;
    line(last, cell); last = cell;
    render(); changed();
  });
  function end() { mode = null; last = null; }
  canvas.addEventListener('pointerup', function (e) {
    if (tap) {
      var moved = Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > 10;
      var t = tap.t; tap = null;
      if (!moved) options.onTargetTap(t);
    }
    end();
  });
  canvas.addEventListener('pointercancel', function () { tap = null; end(); });
  window.addEventListener('resize', resize);

  function changed() { if (options.onChange) options.onChange(self.getDraft()); }

  self.setData = function (d) {
    data = { zones: d.zones || {}, targets: d.targets || [], zoneStates: d.zoneStates || {}, areas: d.areas || { ignore: [], outside: [] } };
    if (!mode) render();
  };
  /* editing: slot id of the zone being edited, 'new' for a new zone, null for none */
  self.edit = function (slot, cells) {
    editing = slot;
    draft = new Set(cells || []);
    render();
  };
  self.clear = function () { draft = new Set(); render(); changed(); };
  self.getDraft = function () { return Array.from(draft).sort(function (a, b) { return a - b; }); };
  self.cellsAround = function (t) {
    var col = Math.floor((t.x - G.xMin) / G.cell), row = Math.floor(t.y / G.cell), out = [];
    // the 2 x 2 cells (1 x 1 m) whose shared corner is nearest to the target
    var c0 = (t.x - G.xMin) / G.cell - col < 0.5 ? col - 1 : col;
    var r0 = t.y / G.cell - row < 0.5 ? row - 1 : row;
    for (var r = r0; r <= r0 + 1; r++) for (var c = c0; c <= c0 + 1; c++) {
      if (r >= 0 && r < G.rows && c >= 0 && c < G.cols) out.push(r * G.cols + c);
    }
    return out;
  };
  self.render = render;
  self.resize = resize;
  resize();
}

/*
 * "Zone is empty after": quick choices plus "Custom" with a number field (0 to 300 seconds,
 * the range the zone logic accepts). Built once, so typing in the field never loses focus.
 * onChange(seconds) gets a whole number, or null while the field holds something invalid.
 */
function FpTimeoutPicker(seg, field, input, error, labels, onChange) {
  var PRESETS = [0, 5, 15, 30];
  var MAX = 300;
  var custom = false;
  var buttons = [];
  seg.innerHTML = '';
  PRESETS.concat(['custom']).forEach(function (p) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'num';
    b.textContent = p === 'custom' ? labels.custom : p + ' s';
    b.addEventListener('click', function () {
      if (p === 'custom') {
        custom = true;
        render();
        input.focus();
        report();
      } else {
        custom = false;
        input.value = String(p);
        render();
        onChange(p);
      }
    });
    buttons.push({ el: b, value: p });
    seg.appendChild(b);
  });
  input.setAttribute('min', '0');
  input.setAttribute('max', String(MAX));
  input.setAttribute('step', '1');
  input.setAttribute('inputmode', 'numeric');
  input.addEventListener('input', report);

  function parse() {
    var raw = String(input.value).trim();
    if (!/^\d+$/.test(raw)) return null;
    var n = Number(raw);
    return n >= 0 && n <= MAX ? n : null;
  }
  function report() {
    var n = parse();
    error.hidden = n !== null;
    error.textContent = labels.invalid;
    input.classList.toggle('invalid', n === null);
    onChange(n);
  }
  function render() {
    var current = parse();
    buttons.forEach(function (b) {
      var on = b.value === 'custom' ? custom : (!custom && current === b.value);
      b.el.setAttribute('aria-pressed', String(on));
    });
    field.hidden = !custom;
    if (!custom) { error.hidden = true; input.classList.remove('invalid'); }
  }
  return {
    set: function (seconds) {
      if (document.activeElement === input) return;
      input.value = String(seconds);
      custom = PRESETS.indexOf(seconds) < 0;
      render();
    },
  };
}

/*
 * FP300 distance strip: 24 blocks of 0.25 m in front of the sensor (0 m at the bottom, 6 m at the top).
 * Same interface as FpMap (setData, edit, clear, getDraft, render, resize), so pages can swap them.
 * The block where the sensor measures the nearest person lights up.
 */
var FP_BLOCKS = 24, FP_BLOCK = 0.25;

function fpBlockInfo(blocks) {
  return {
    count: blocks.length,
    from: blocks.length ? Math.min.apply(null, blocks) * FP_BLOCK : 0,
    to: blocks.length ? (Math.max.apply(null, blocks) + 1) * FP_BLOCK : 0,
  };
}

function FpRow(canvas, options) {
  var self = this;
  var ctx = canvas.getContext('2d');
  var css = getComputedStyle(document.documentElement);
  var data = { zones: {}, zoneStates: {}, block: null, presence: null };
  var draft = new Set(), editing = null, mode = null, last = null, pulse = 0, timer = null;
  var LANE = 9, LABEL = 40, BOTTOM = 26;
  self.top = options.topPad || 14;
  self.mirror = false; // not used for a strip, kept for the same interface

  function color(name) { return css.getPropertyValue(name).trim(); }
  function zoneBlocks(z) { return z.blocks || z.cells || []; }

  function resize() {
    var w = canvas.clientWidth || 340;
    var rowH = Math.max(18, Math.min(26, Math.round(w / 15)));
    if (options.fitHeight) {
      // make all 6 m fit in the space the page has left, so nobody has to scroll over the strip
      var avail = options.fitHeight();
      if (avail > 0) rowH = Math.max(12, Math.min(26, Math.floor((avail - self.top - BOTTOM) / FP_BLOCKS)));
    }
    var h = self.top + FP_BLOCKS * rowH + BOTTOM;
    var r = window.devicePixelRatio || 1;
    canvas.style.height = h + 'px';
    canvas.width = Math.round(w * r); canvas.height = Math.round(h * r);
    ctx.setTransform(r, 0, 0, r, 0, 0);
    self.w = w; self.h = h; self.rowH = rowH;
    render();
  }
  function lanesWidth() { return Object.keys(data.zones).length * (LANE + 4); }
  function blockRect(b) {
    var x = LABEL, wid = self.w - LABEL - 8 - lanesWidth();
    return { x: x, y: self.top + (FP_BLOCKS - 1 - b) * self.rowH, w: wid, h: self.rowH };
  }
  function blockAt(evt) {
    var bb = canvas.getBoundingClientRect(), y = evt.clientY - bb.top, x = evt.clientX - bb.left;
    if (x < LABEL - 10) return null;
    var b = FP_BLOCKS - 1 - Math.floor((y - self.top) / self.rowH);
    return b >= 0 && b < FP_BLOCKS ? b : null;
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function render() {
    if (!self.w) return;
    ctx.clearRect(0, 0, self.w, self.h);
    var draftColor = editing === 'range' ? color('--radar')
      : editing && editing !== 'new' ? FP_ZONE_COLORS[(editing - 1) % 8] : color('--ink');
    ctx.font = '11px ' + color('--font');
    for (var b = 0; b < FP_BLOCKS; b++) {
      var r = blockRect(b), on = draft.has(b), here = data.block === b;
      ctx.globalAlpha = on ? 0.9 : 0.45;
      ctx.fillStyle = on ? draftColor : color('--line');
      roundRect(r.x, r.y + 1.5, r.w, r.h - 3, 5); ctx.fill();
      ctx.globalAlpha = 1;
      if (here) {
        // the block where the sensor sees someone: bright outline and a dot, gently pulsing
        var glow = 0.55 + 0.45 * Math.abs(Math.sin(pulse));
        ctx.strokeStyle = color('--target'); ctx.lineWidth = 3; ctx.globalAlpha = glow;
        roundRect(r.x + 1.5, r.y + 3, r.w - 3, r.h - 6, 5); ctx.stroke(); ctx.globalAlpha = 1;
        ctx.fillStyle = color('--target');
        ctx.beginPath(); ctx.arc(r.x + r.w / 2, r.y + r.h / 2, Math.min(7, r.h / 3), 0, 6.29); ctx.fill();
      }
      if (b % 4 === 0) {
        ctx.fillStyle = color('--muted');
        ctx.fillText((b * FP_BLOCK).toFixed(0) + ' m', 4, r.y + r.h + 4);
      }
      if (b % 2 === 0 && b % 4 !== 0 && self.rowH >= 16) {
        ctx.fillStyle = color('--muted'); ctx.globalAlpha = 0.6;
        ctx.fillText((b * FP_BLOCK).toFixed(1).replace('.', ','), 4, r.y + r.h + 4);
        ctx.globalAlpha = 1;
      }
    }
    ctx.fillStyle = color('--muted');
    ctx.fillText('6 m', 4, self.top + 4);

    // other zones as coloured lanes on the right
    var ids = Object.keys(data.zones), lx = self.w - 8 - lanesWidth();
    ids.forEach(function (id, i) {
      var z = data.zones[id], c = FP_ZONE_COLORS[(id - 1) % 8], st = data.zoneStates[id] || {};
      var x = lx + 4 + i * (LANE + 4);
      zoneBlocks(z).forEach(function (blk) {
        var r = blockRect(blk);
        ctx.globalAlpha = String(id) === String(editing) ? 1 : (st.occupied ? 0.9 : 0.5);
        ctx.fillStyle = c; roundRect(x, r.y + 1.5, LANE, r.h - 3, 3); ctx.fill();
      });
      ctx.globalAlpha = 1;
    });

    // sensor at the bottom
    ctx.fillStyle = color('--ink');
    roundRect(LABEL + (self.w - LABEL - 8 - lanesWidth()) / 2 - 16, self.h - BOTTOM + 14, 32, 6, 3); ctx.fill();
  }

  function apply(b) { if (b === null) return; if (mode === 'paint') draft.add(b); else draft.delete(b); }
  canvas.addEventListener('pointerdown', function (e) {
    if (!options.paint) return;
    var b = blockAt(e); if (b === null) return;
    mode = draft.has(b) ? 'erase' : 'paint';
    apply(b); last = b; canvas.setPointerCapture(e.pointerId); render(); changed();
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!mode) return;
    var b = blockAt(e); if (b === null || b === last) return;
    var step = b > last ? 1 : -1;
    for (var k = last + step; k !== b + step; k += step) apply(k);
    last = b; render(); changed();
  });
  function end() { mode = null; last = null; }
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  window.addEventListener('resize', resize);
  function changed() { if (options.onChange) options.onChange(self.getDraft()); }

  function animate() {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (timer) clearInterval(timer);
    timer = null;
    if (data.block !== null && !reduce) timer = setInterval(function () { pulse += 0.25; render(); }, 60);
  }

  self.setData = function (d) {
    data = { zones: d.zones || {}, zoneStates: d.zoneStates || {}, block: d.block === undefined ? null : d.block, presence: d.presence };
    if ((data.block !== null) !== (timer !== null)) animate();
    if (!mode) render();
  };
  self.edit = function (slot, blocks) { editing = slot; draft = new Set(blocks || []); render(); };
  self.clear = function () { draft = new Set(); render(); changed(); };
  self.getDraft = function () { return Array.from(draft).sort(function (a, b) { return a - b; }); };
  self.setPaint = function (on) { options.paint = on; };
  self.destroy = function () { if (timer) clearInterval(timer); timer = null; };
  self.render = render;
  self.resize = resize;
  resize();
}
</script>
<div class="fp fp-wizard" id="fp">
  <div class="fp-step-label num" id="stepLabel"></div>
  <div class="fp-steps" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <!-- 1 sensor -->
  <section data-step="1">
    <h2 data-t="s1_title"></h2>
    <p data-t="s1_text"></p>
    <div id="sensors"></div>
  </section>

  <!-- 2 draw -->
  <section data-step="2" hidden>
    <h2 id="s2Title"></h2>
    <p id="s2Text"></p>
    <div class="fp-map-bar fp-map-bar-top">
      <span class="num" id="cellInfo"></span>
      <button class="fp-link" id="clear" data-t="clear"></button>
    </div>
    <div class="fp-map-bar fp-map-bar-top">
      <span class="fp-live" id="live"><i></i><span id="liveText"></span></span>
      <label class="fp-switch" id="mirrorWrap"><input type="checkbox" id="mirror"><span data-t="mirror"></span></label>
    </div>
    <div class="fp-map-wrap" id="mapWrap"><canvas class="fp-map" id="map"></canvas></div>
    <div class="fp-map-wrap" id="rowWrap" hidden><canvas class="fp-map" id="row"></canvas></div>
    <div id="existingWrap" hidden>
      <p class="fp-note" style="margin-top:16px" data-t="existing"></p>
      <div class="fp-chips" id="existing"></div>
    </div>
  </section>

  <!-- 3 name -->
  <section data-step="3" hidden>
    <h2 data-t="s3_title"></h2>
    <p data-t="s3_text"></p>
    <div class="fp-field">
      <label for="name" data-t="name"></label>
      <input class="fp-input" id="name" maxlength="32" autocomplete="off">
      <div class="fp-chips" id="suggestions"></div>
    </div>
    <div class="fp-field">
      <label data-t="empty_after"></label>
      <div class="fp-seg" id="timeouts"></div>
      <div class="fp-custom" id="customField" hidden>
        <label for="customSeconds" data-t="custom_label"></label>
        <div class="fp-custom-row"><input class="fp-input num" id="customSeconds" type="number"><span data-t="seconds"></span></div>
        <p class="fp-error" id="customError" hidden></p>
      </div>
      <p class="fp-note" style="margin-top:8px" data-t="empty_hint"></p>
    </div>
  </section>

  <!-- 4 check -->
  <section data-step="4" hidden>
    <h2 data-t="s4_title"></h2>
    <p data-t="s4_text"></p>
    <dl class="fp-summary num" id="summary"></dl>
  </section>

  <div class="fp-actions">
    <button class="fp-btn ghost" id="back" data-t="back"></button>
    <button class="fp-btn primary" id="next"></button>
  </div>
</div>

    if (state.step === 1) return !!state.sensor;
    if (state.step === 2) return state.cells.length > 0;
    if (state.step === 3) return state.name.trim().length > 0 && state.timeout !== null;
    return true;
  }
  function update() {
    document.querySelectorAll('section[data-step]').forEach(function (s) { s.hidden = Number(s.dataset.step) !== state.step; });
    document.querySelectorAll('.fp-steps span').forEach(function (s, i) { s.classList.toggle('done', i < state.step); });
    $('stepLabel').textContent = t('step', { n: state.step });
    $('back').hidden = state.step === 1;
    $('next').textContent = state.step === 4 ? t('add') : t('next');
    $('next').disabled = !canGoOn();
  }
  function go(step) {
    state.step = step;
    if (step === 2) {
      useEditor();
      if (state.existingSlot === null) map.edit('new', state.cells);
      renderExisting(); markExisting(); renderCellInfo(); startPolling();
      setTimeout(function () { map.resize(); }, 0);
    } else stopPolling();
    if (step === 3) renderNaming();
    if (step === 4) renderSummary();
    update();
    window.scrollTo(0, 0);
  }

  $('back').addEventListener('click', function () { go(state.step - 1); });
  $('next').addEventListener('click', function () {
    if (!canGoOn()) return;
    if (state.step < 4) return go(state.step + 1);
    create();
  });

  function create() {
    Homey.showLoadingOverlay();
    var zone = { name: state.name.trim(), cells: state.cells, absence_timeout: state.timeout };
    Homey.emit('save_zone', { token: state.sensor.token, slot: state.existingSlot, zone: zone })
      .then(function (device) { return Homey.createDevice(device); })
      .then(function () { Homey.done(); })
      .catch(function (err) {
        Homey.hideLoadingOverlay();
        Homey.alert(err && err.message ? err.message : String(err));
      });
  }

  Homey.emit('list_sensors').then(function (list) {
    state.sensors = list;
    if (list.length === 1) state.sensor = list[0];
    renderSensors(); update();
  }).catch(function (err) { Homey.alert(err.message || String(err)); });

  update();
})();
</script>
