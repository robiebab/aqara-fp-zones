<div class="fp fp-wizard" id="fp">
  <div class="fp-step-label num" id="stepLabel"></div>
  <div class="fp-steps" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <!-- 1 sensor -->
  <section data-step="1">
    <h2 data-t="s1_title"></h2>
    <p data-t="s1_text"></p>
    <div id="sensors"></div>
  </section>

  <!-- 2 draw -->
  <section data-step="2" hidden>
    <h2 id="s2Title"></h2>
    <p id="s2Text"></p>
    <div class="fp-map-bar fp-map-bar-top">
      <span class="num" id="cellInfo"></span>
      <button class="fp-link" id="clear" data-t="clear"></button>
    </div>
    <div class="fp-map-bar fp-map-bar-top">
      <span class="fp-live" id="live"><i></i><span id="liveText"></span></span>
      <label class="fp-switch" id="mirrorWrap"><input type="checkbox" id="mirror"><span data-t="mirror"></span></label>
    </div>
    <div class="fp-map-wrap" id="mapWrap"><canvas class="fp-map" id="map"></canvas></div>
    <div class="fp-map-wrap" id="rowWrap" hidden><canvas class="fp-map" id="row"></canvas></div>
    <div id="existingWrap" hidden>
      <p class="fp-note" style="margin-top:16px" data-t="existing"></p>
      <div class="fp-chips" id="existing"></div>
    </div>
  </section>

  <!-- 3 name -->
  <section data-step="3" hidden>
    <h2 data-t="s3_title"></h2>
    <p data-t="s3_text"></p>
    <div class="fp-field">
      <label for="name" data-t="name"></label>
      <input class="fp-input" id="name" maxlength="32" autocomplete="off">
      <div class="fp-chips" id="suggestions"></div>
    </div>
    <div class="fp-field">
      <label data-t="empty_after"></label>
      <div class="fp-seg" id="timeouts"></div>
      <div class="fp-custom" id="customField" hidden>
        <label for="customSeconds" data-t="custom_label"></label>
        <div class="fp-custom-row"><input class="fp-input num" id="customSeconds" type="number"><span data-t="seconds"></span></div>
        <p class="fp-error" id="customError" hidden></p>
      </div>
      <p class="fp-note" style="margin-top:8px" data-t="empty_hint"></p>
    </div>
  </section>

  <!-- 4 check -->
  <section data-step="4" hidden>
    <h2 data-t="s4_title"></h2>
    <p data-t="s4_text"></p>
    <dl class="fp-summary num" id="summary"></dl>
  </section>

  <div class="fp-actions">
    <button class="fp-btn ghost" id="back" data-t="back"></button>
    <button class="fp-btn primary" id="next"></button>
  </div>
</div>

  var state = { step: 1, sensors: [], sensor: null, cells: [], existingSlot: null, name: '', timeout: 5 };

  function fit() {

  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);

    fitHeight: function () {

  function markExisting() {
    document.querySelectorAll('#existing .fp-chip').forEach(function (c) {
      c.setAttribute('aria-pressed', String(Number(c.dataset.slot) === state.existingSlot));
    });
  }

  function poll() {
    if (document.hidden) return;
    Homey.emit('get_state', { token: state.sensor.token }).then(function (live) {
      map.setData(live);
      if (live.kind === 'fp300') {
        var known = live.presence && live.block !== null && live.block !== undefined;
        $('live').classList.toggle('on', !!known);
        $('liveText').textContent = known
          ? t('live_fp300', { distance: m(live.distance), age: live.distanceAge === null ? '?' : live.distanceAge })
          : live.pirOnly ? t('live_fp300_pir')
          : live.tracking === 'waiting' ? t('live_fp300_waiting')
          : t(live.presence ? 'live_fp300_far' : 'live_fp300_off');
        return;
      }
      $('live').classList.toggle('on', live.fresh);
      $('liveText').textContent = live.fresh ? t('live_on', { count: live.targets.length }) : t('live_off');
    }).catch(function () {});
  }
  function startPolling() { stopPolling(); poll(); pollTimer = setInterval(poll, 1000); }
  function stopPolling() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

  /* ---------- step 3 */
  function renderNaming() {
    $('name').value = state.name;
    var sug = $('suggestions');
    sug.innerHTML = '';
    t('suggestions').split(',').forEach(function (s) {
      var c = document.createElement('button');
      c.className = 'fp-chip';
      c.textContent = s.trim();
      c.setAttribute('aria-pressed', String(state.name === s.trim()));
      c.addEventListener('click', function () { state.name = s.trim(); renderNaming(); update(); });
      sug.appendChild(c);
    });
    timeoutPicker.set(state.timeout);
  }
  var timeoutPicker = new FpTimeoutPicker($('timeouts'), $('customField'), $('customSeconds'), $('customError'),
    { custom: t('custom'), invalid: t('custom_invalid') },
    function (seconds) { state.timeout = seconds; update(); });
  $('name').addEventListener('input', function () { state.name = this.value; update(); });

  /* ---------- step 4 */
  function renderSummary() {
    var info = isFp300() ? fpBlockInfo(state.cells) : fpCellInfo(state.cells);
    var size = isFp300()
      ? String(info.count)
      : t(info.count === 1 ? 'cells_one' : 'cells', { count: info.count, area: m(info.area) });
    var rows = [
      [t('sum_sensor'), state.sensor.name],
      [t('sum_name'), state.name.trim()],
      [t(isFp300() ? 'sum_blocks' : 'sum_size'), size],
      [t('sum_distance'), m(info.from) + ' ' + t('to') + ' ' + m(info.to) + ' m'],
      [t('sum_empty'), state.timeout + ' s'],
    ];
    $('summary').innerHTML = '';
    rows.forEach(function (r) {
      var dt = document.createElement('dt'); dt.textContent = r[0];
      var dd = document.createElement('dd'); dd.textContent = r[1];
      $('summary').appendChild(dt); $('summary').appendChild(dd);
    });
  }

  /* ---------- navigation */
  function canGoOn() {
    if (state.step === 1) return !!state.sensor;
    if (state.step === 2) return state.cells.length > 0;
    if (state.step === 3) return state.name.trim().length > 0 && state.timeout !== null;
    return true;
  }
  function update() {
    document.querySelectorAll('section[data-step]').forEach(function (s) { s.hidden = Number(s.dataset.step) !== state.step; });
    document.querySelectorAll('.fp-steps span').forEach(function (s, i) { s.classList.toggle('done', i < state.step); });
    $('stepLabel').textContent = t('step', { n: state.step });
    $('back').hidden = state.step === 1;
    $('next').textContent = state.step === 4 ? t('add') : t('next');
    $('next').disabled = !canGoOn();
  }
  function go(step) {
    state.step = step;
    if (step === 2) {
      useEditor();
      if (state.existingSlot === null) map.edit('new', state.cells);
      renderExisting(); markExisting(); renderCellInfo(); startPolling();
      setTimeout(function () { map.resize(); }, 0);
    } else stopPolling();
    if (step === 3) renderNaming();
    if (step === 4) renderSummary();
    update();
    window.scrollTo(0, 0);
  }

  $('back').addEventListener('click', function () { go(state.step - 1); });
  $('next').addEventListener('click', function () {
    if (!canGoOn()) return;
    if (state.step < 4) return go(state.step + 1);
    create();
  });

  function create() {
    Homey.showLoadingOverlay();
    var zone = { name: state.name.trim(), cells: state.cells, absence_timeout: state.timeout };
    Homey.emit('save_zone', { token: state.sensor.token, slot: state.existingSlot, zone: zone })
      .then(function (device) { return Homey.createDevice(device); })
      .then(function () { Homey.done(); })
      .catch(function (err) {
        Homey.hideLoadingOverlay();
        Homey.alert(err && err.message ? err.message : String(err));
      });
  }

  Homey.emit('list_sensors').then(function (list) {
    state.sensors = list;
    if (list.length === 1) state.sensor = list[0];
    renderSensors(); update();
  }).catch(function (err) { Homey.alert(err.message || String(err)); });

  update();
})();
</script>
